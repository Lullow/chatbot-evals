<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker chatbot</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    #meta { color: #666; font-size: .9rem; }
    #log { border: 1px solid #ccc; border-radius: 6px; padding: 0 1rem; min-height: 12rem; }
    .user { font-weight: 600; }
    .bot { white-space: pre-wrap; }
    .error { color: #b00020; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .5rem; }
  </style>
</head>
<body>
  <h1>Docker chatbot</h1>
  <p id="meta"></p>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Ask something…" required autofocus>
    <button id="send">Send</button>
  </form>

  <script>
    const messages = [];
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    function add(cls, text) {
      const p = document.createElement("p");
      p.className = cls;
      p.textContent = text;
      log.append(p);
      return p;
    }

    fetch("/health").then(r => r.json()).then(h => {
      document.getElementById("meta").textContent = `Model: ${h.model} · served by ${h.host}`;
    });

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      messages.push({ role: "user", content: text });
      add("user", text);
      const pending = add("bot", "…");
      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : r.statusText);
        pending.textContent = data.reply;
        messages.push({ role: "assistant", content: data.reply });
      } catch (err) {
        pending.className = "error";
        pending.textContent = err.message;
        messages.pop();  // en fråga som inte fick svar ska inte ligga kvar i samtalet
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
